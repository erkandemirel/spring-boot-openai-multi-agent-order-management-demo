spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: supervisor-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/multi_agent_orders}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: supervisor-agent
      auto-offset-reset: earliest

server:
  port: 8100

management:
  endpoints:
    web:
      exposure:
        include: health,info
